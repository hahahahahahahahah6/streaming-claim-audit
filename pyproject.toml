[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented streaming and low-memory claims"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "streaming-claim-audit contributors"}]
dependencies = []

[project.scripts]
streaming-claim-audit = "streaming_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
